[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hcc-advisor"
# Single source of truth: hcc_advisor.__version__ (see [tool.hatch.version])
dynamic = ["version"]
description = "Oracle HCC Compression Analysis and Management Dashboard"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Daniel Moya" }]
dependencies = [
    "streamlit>=1.31.0",
    "streamlit-option-menu>=0.3.12",
    "oracledb>=2.0.1",
    "pandas>=2.2.0",
    "numpy>=1.26.3",
    "plotly>=5.18.0",
    "altair>=5.2.0",
    "openpyxl>=3.1.2",
    "xlsxwriter>=3.1.9",
    "python-dotenv>=1.0.1",
    "cryptography>=42.0.2",
    "pytz>=2024.1",
]

[project.optional-dependencies]
ssl = ["pyOpenSSL>=24.0.0"]
ords = ["requests>=2.31.0", "urllib3>=2.1.0"]

[project.scripts]
hcc-advisor = "hcc_advisor.cli:main"

[tool.hatch.version]
path = "python/hcc_advisor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["python/hcc_advisor"]

[tool.hatch.build.targets.wheel.force-include]
"sql/central" = "hcc_advisor/sql/central"
# SQL patches applied by Admin > SQL Patches and the deployment page's Upgrade
"sql/patches" = "hcc_advisor/sql/patches"
