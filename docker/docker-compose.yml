# =============================================================================
# HCC Compression Advisor - Centralized Server Deployment
# =============================================================================
# Central server architecture: Oracle 23c Free stores analysis results from
# all target databases. Target Oracle databases are remote and registered
# through the dashboard UI.
#
# Usage:
#   docker compose up -d
#
# For local development with bundled target DB, use:
#   docker compose -f docker-compose.dev.yml up -d
# =============================================================================

services:
  # Central Oracle Database (metadata store for all target DB results)
  central-db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hcc-central-db
    hostname: central-db
    restart: unless-stopped

    # Port mappings
    # SECURITY: bind to loopback only. The Oracle listener and EM Express
    # console must NOT be reachable from the public host interface (0.0.0.0).
    # For remote DB admin, tunnel over SSH/WireGuard to 127.0.0.1.
    ports:
      - "127.0.0.1:1521:1521"   # Oracle Database listener (loopback only)
      - "127.0.0.1:5500:5500"   # Oracle Enterprise Manager Express (loopback only)

    # Environment variables
    env_file:
      - .env

    environment:
      # Oracle Database configuration
      # SECURITY: no weak fallback defaults — the stack refuses to start if the
      # secret is not provided in .env (fail-closed). Set ORACLE_PWD in .env.
      - ORACLE_PWD=${ORACLE_PWD:?ORACLE_PWD must be set in .env}
      - ORACLE_CHARACTERSET=AL32UTF8
      - ENABLE_ARCHIVELOG=false
      - ENABLE_FORCE_LOGGING=false

      # Compression Advisor central user
      - COMPRESSION_USER=${COMPRESSION_USER:-COMPRESSION_MGR}
      - COMPRESSION_PWD=${COMPRESSION_PWD:?COMPRESSION_PWD must be set in .env}
      - COMPRESSION_TS=${COMPRESSION_TS:-SCRATCH_TS}

      # Performance tuning
      - INIT_SGA_SIZE=2048
      - INIT_PGA_SIZE=1024

    # Volume mounts for persistence
    volumes:
      # Persistent database files
      - central-data:/opt/oracle/oradata

      # Central DB initialization scripts (setup = runs once on first creation)
      - ./init-scripts-central:/opt/oracle/scripts/setup

      # Central schema SQL files
      - ../sql/central:/opt/oracle/compression_advisor/sql/central:ro

      # Diagnostic logs
      - ./logs:/opt/oracle/oradata/logs

    # Shared memory configuration for Oracle SGA
    shm_size: 2gb

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

    # Health check
    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    networks:
      - hcc-network

  # Target Oracle Database (test instance with ~1GB sample data)
  target-db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hcc-target-db
    hostname: target-db
    restart: unless-stopped

    # SECURITY: bind to loopback only. The target Oracle listener must NOT be
    # reachable from the public host interface (0.0.0.0). Tunnel for remote access.
    ports:
      - "127.0.0.1:1522:1521"   # Oracle Database listener (loopback only)

    env_file:
      - .env

    environment:
      - ORACLE_PWD=${ORACLE_PWD:?ORACLE_PWD must be set in .env}
      - ORACLE_CHARACTERSET=AL32UTF8
      - ENABLE_ARCHIVELOG=false
      - ENABLE_FORCE_LOGGING=false
      - COMPRESSION_USER=${COMPRESSION_USER:-COMPRESSION_MGR}
      - COMPRESSION_PWD=${COMPRESSION_PWD:?COMPRESSION_PWD must be set in .env}

      # Smaller SGA for test instance
      - INIT_SGA_SIZE=1024
      - INIT_PGA_SIZE=512

    volumes:
      - target-data:/opt/oracle/oradata
      - ./init-scripts-target:/opt/oracle/scripts/setup
      - ./logs:/opt/oracle/oradata/logs

    shm_size: 1gb

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    networks:
      - hcc-network

  # Streamlit Dashboard
  streamlit-dashboard:
    build:
      context: ../python
      dockerfile: Dockerfile
    container_name: hcc-streamlit
    hostname: streamlit
    restart: unless-stopped

    # SECURITY: do NOT publish Streamlit to the host (no 0.0.0.0:8501).
    # The dashboard is reached from the public hostname (hcc.danimoya.com)
    # through nginx-proxy-manager on the external `management-network`, which
    # terminates TLS and applies edge auth/headers. Publishing 8501 to the host
    # would bypass the reverse proxy entirely. NPM reaches this container by name
    # (streamlit:8501) over the shared network, so no host port is required.

    # Environment variables
    environment:
      # Central DB connection
      - CENTRAL_DB_HOST=central-db
      - CENTRAL_DB_PORT=1521
      - CENTRAL_DB_SERVICE=FREEPDB1
      - CENTRAL_DB_USER=${COMPRESSION_USER:-COMPRESSION_MGR}
      - CENTRAL_DB_PASSWORD=${COMPRESSION_PWD:?COMPRESSION_PWD must be set in .env}

      # Legacy DB vars (fallback, point to central)
      - DB_HOST=central-db
      - DB_PORT=1521
      - DB_SERVICE=FREEPDB1
      - DB_USER=${COMPRESSION_USER:-COMPRESSION_MGR}
      - DB_PASSWORD=${COMPRESSION_PWD:?COMPRESSION_PWD must be set in .env}

      # Encryption key for target DB passwords
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}

      # Dashboard authentication
      # SECURITY: no fallback — fail-closed if DASHBOARD_PASSWORD is unset.
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:?DASHBOARD_PASSWORD must be set in .env}

      # SSL disabled in Docker
      - SSL_ENABLED=false

    # Volume mounts
    volumes:
      - streamlit-logs:/app/logs
      # Central schema SQL files for deployment wizard
      - ../sql/central:/app/hcc_advisor/sql/central:ro
      # Versioned SQL patches for Admin → SQL Patches tab
      - ../sql/patches:/app/hcc_advisor/sql/patches:ro

    # Depends on Central Database
    depends_on:
      central-db:
        condition: service_healthy

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

    networks:
      - hcc-network
      - management-network

# Named volumes for data persistence
volumes:
  central-data:
    driver: local

  target-data:
    driver: local

  streamlit-logs:
    driver: local

# Custom network for container communication
networks:
  hcc-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

  # Pre-existing bridge on the host that NPM (nginx-proxy-manager) is on.
  # Streamlit must be attached so the public host hcc.danimoya.com resolves.
  # Marked external so `docker compose up` joins it without trying to manage it.
  management-network:
    external: true
