# Security response headers for the HCC Compression Advisor edge.
#
# The dashboard is fronted by Nginx Proxy Manager (openresty) at
# https://hcc.danimoya.com. Today only HSTS is emitted. Paste the directives
# below into the NPM proxy host's "Advanced" tab (Custom Nginx Configuration),
# or `include` this file from the relevant server/location block, then reload
# nginx so the dashboard is protected against clickjacking and MIME sniffing.
#
# `always` ensures the headers are sent on error responses too.

# Deny framing entirely (clickjacking protection for the SQL-execution and
# DB-registration controls). frame-ancestors in the CSP below is the modern
# equivalent; X-Frame-Options is kept for older browsers.
add_header X-Frame-Options "DENY" always;

# Stop browsers from MIME-sniffing responses away from the declared type.
add_header X-Content-Type-Options "nosniff" always;

# Do not leak the dashboard URL (which may carry state) to third parties.
add_header Referrer-Policy "no-referrer" always;

# Content-Security-Policy. Streamlit injects inline styles/scripts and uses
# WebSockets to the same origin, so 'unsafe-inline'/'unsafe-eval' and ws/wss
# are required for it to function; frame-ancestors 'none' blocks framing and
# object-src 'none' blocks legacy plugin vectors. Tighten further if a future
# Streamlit release supports nonces/hashes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
