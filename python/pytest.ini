[pytest]
testpaths = tests
# hcc_advisor/test_connection.py is a manual connectivity script (it opens
# the configured central DB and ORDS), not a test: never collect the package.
norecursedirs = hcc_advisor .* build dist *.egg venv
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Coverage of the application package, with the lines each module misses
# (fully covered modules are left out of the table). The floor sits a couple
# of points under the measured total (56.3% when it was set) so a real
# regression fails the run while ordinary churn does not; raise it as coverage
# grows. For an HTML report add --cov-report=html. tests/integration needs a
# database and is skipped unless HCC_TEST_DB_* is set (see its docstring).
addopts =
    --strict-markers
    --tb=short
    --cov=hcc_advisor
    --cov-report=term-missing:skip-covered
    --cov-fail-under=54
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    database: Tests requiring database connection
    api: Tests for API client
    auth: Authentication tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
